<style>
    #users-list {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .user-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
    }

    .user-name {
        font-weight: bold;
    }

    .btn-sm {
        padding: 4px 8px;
        font-size: 14px;
    }
</style>

{% load custom_filter %}
{% if target_user == user %}
<div id="users-list">
    <h4>All Registered Users</h4>
    <a href="{% url 'home' %}">
        <button style="color:whitesmoke; background-color: blue; margin-right: 10px;">Back to Home</button>
    </a>
    <br><br>

    {% for u in users %}
        <div class="user-item" style="margin-bottom: 10px;">
            <div class="user-name"><strong>{{ u.firstname }} {{ u.lastname }}</strong></div>
            <div>
                {% if u.id in sent_request_ids %}
                    
                    <a href="{% url 'cancel_friend_request' u.id %}" class="btn btn-danger btn-sm">
                        <button style="color:white; background-color:skyblue;">Cancel Request</button>
                    </a>
                {% elif u.id in received_request_dict %}
                   
                    <a href="{% url 'accept_friend_request' received_request_dict|get_item:u.id %}" class="btn btn-success btn-sm">
                        <button style="color:white; background-color:green;">Accept</button>
                    </a>
                {% else %}
                   
                    <a href="{% url 'send_friend_request' u.id %}" class="btn btn-outline-primary btn-sm">
                        <button style="color:white; background-color:green;">Send Request</button>
                    </a>
                {% endif %}
            </div>
        </div>
    {% endfor %}
</div>
{% endif %}
